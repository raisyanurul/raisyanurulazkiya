
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Perkalian 8</title>
    <ul>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            font-size: 25px;
        }

        p {
            color: #666;
        }

        button {
            background-color: #2878c8;
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #1b5e9e;
        }

        #hasil {
            margin-top: 20px;
            padding: 15px;
            background-color: #f2f2f2;
            border-radius: 8px;
            line-height: 2;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Tabel Perkalian 8</h1>

        <p>Perkalian angka 8 dari 1 sampai 10</p>

        <button onclick="hitungPerkalian()">
            Tampilkan Perkalian
        </button>

        <div id="hasil">
            Hasil akan muncul di sini.
        </div>

    </div>

    <script>
        function hitungPerkalian() {

            let hasil = "";

            for (let angka = 1; angka <= 10; angka++) {

                let perkalian = 8 * angka;

                hasil += "8 × " + angka + " = " + perkalian + "<br>";
            }

            document.getElementById("hasil").innerHTML = hasil;
        }
    </script>

</body>
</html>
