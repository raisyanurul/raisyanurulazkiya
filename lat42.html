
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penghitung Usia</title>
</head>
<body>

    <label for="tanggalLahir">Tanggal lahir kamu:</label>
    <input type="date" id="tanggalLahir" value="2008-03-12">

    <p id="hasilUsia"></p>

    <script>
        const inputTanggal = document.getElementById("tanggalLahir");
        const hasilUsia = document.getElementById("hasilUsia");

        function hitungUsia() {
            if (!inputTanggal.value) {
                hasilUsia.textContent = "";
                return;
            }

            const lahir = new Date(inputTanggal.value + "T00:00:00");
            const sekarang = new Date();

            if (lahir > sekarang) {
                hasilUsia.textContent = "Tanggal lahir tidak valid.";
                return;
            }

            let tahun = sekarang.getFullYear() - lahir.getFullYear();
            let bulan = sekarang.getMonth() - lahir.getMonth();
            let hari = sekarang.getDate() - lahir.getDate();

            if (hari < 0) {
                bulan--;
                const hariBulanSebelumnya = new Date(
                    sekarang.getFullYear(),
                    sekarang.getMonth(),
                    0
                ).getDate();
                hari += hariBulanSebelumnya;
            }

            if (bulan < 0) {
                tahun--;
                bulan += 12;
            }

            hasilUsia.textContent =
                `Kamu sudah berusia ${tahun} tahun ${bulan} bulan ${hari} hari.`;
        }

        inputTanggal.addEventListener("input", hitungUsia);
        hitungUsia();
    </script>

</body>
</html>
