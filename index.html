
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biodata Mahasiswa - Raisya</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #101d49, #173e99);
    padding: 30px 15px;
    color: #26334c;
}

.container {
    max-width: 650px;
    margin: auto;
}

/* BIODATA */

.profile {
    background: white;
    border-radius: 0 0 35px 35px;
    text-align: center;
    padding: 35px 25px;
    box-shadow: 0 12px 30px #07153555;
}

.profile h2 {
    margin-bottom: 30px;
    font-weight: normal;
}

.data {
    margin-bottom: 30px;
}

.data p {
    font-size: 19px;
    margin-bottom: 25px;
    color: #34415e;
}

.data strong {
    display: block;
    font-size: 21px;
    font-weight: normal;
    margin-top: 15px;
}

.line {
    border-top: 1px solid #ccc;
    margin: 35px 20px;
}

/* NAVIGASI */

.navigation h3 {
    font-size: 21px;
    font-weight: normal;
    margin-bottom: 25px;
}

.nav-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
}

.nav-buttons button {
    background: #2450d6;
    color: white;
    border: none;
    padding: 19px 22px;
    border-radius: 13px;
    font-size: 17px;
    cursor: pointer;
}

.nav-buttons button:hover {
    background: #173aaf;
}

footer {
    background: #f0f3fa;
    margin: 45px -25px -35px;
    padding: 32px 10px;
    border-radius: 0 0 35px 35px;
    color: #718096;
    font-size: 19px;
}

/* HALAMAN LATIHAN */

.task-viewer {
    display: none;
    background: white;
    margin-top: 35px;
    padding: 22px;
    border-radius: 25px;
    box-shadow: 0 10px 25px #07153555;
}

.task-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 20px;
}

.task-header h2 {
    font-size: 21px;
}

.back-button {
    background: #2450d6;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 10px;
    cursor: pointer;
}

.task-frame {
    width: 100%;
    height: 650px;
    border: 1px solid #ddd;
    border-radius: 12px;
    background: white;
}

/* KALKULATOR */

.calculator {
    background: #202a3c;
    margin-top: 65px;
    border-radius: 30px;
    padding: 25px 22px;
    box-shadow: 0 10px 25px #07153555;
}

.calculator h1 {
    color: white;
    text-align: center;
    font-size: 25px;
    font-weight: normal;
    letter-spacing: 2px;
    margin-bottom: 35px;
}

.screen {
    background: #dce8d3;
    border-radius: 20px;
    min-height: 175px;
    padding: 20px;
    margin-bottom: 25px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    overflow: hidden;
}

#display {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    text-align: right;
    font-size: 30px;
    color: #18251b;
    margin-bottom: 15px;
}

#result {
    font-size: 17px;
    color: #53644f;
    word-break: break-all;
}

.top-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 35px;
}

.top-buttons button {
    background: transparent;
    color: white;
    border: 2px solid #e5e8ed;
    border-radius: 12px;
    padding: 18px 5px;
    font-size: 17px;
    cursor: pointer;
}

.section-title {
    color: #b6c0d1;
    margin: 25px 0 18px;
    font-size: 17px;
}

.keys {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.keys button {
    border: none;
    border-radius: 15px;
    padding: 17px 3px;
    font-size: 17px;
    background: #43536d;
    color: white;
    cursor: pointer;
    min-width: 0;
}

.keys button:hover {
    filter: brightness(1.2);
}

.keys .operator {
    background: #2450d6;
}

.keys .special {
    background: #657b9d;
}

.keys .equal {
    background: #1d9b78;
}

.keys .clear {
    background: #c34b58;
}

.calculator-note {
    text-align: center;
    color: #aab5c7;
    margin-top: 25px;
    font-size: 13px;
}

@media(max-width: 400px) {
    .keys {
        gap: 7px;
    }

    .keys button {
        padding: 15px 2px;
        font-size: 15px;
    }

    .calculator h1 {
        font-size: 21px;
    }

    .nav-buttons button {
        padding: 16px;
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- BIODATA MAHASISWA -->

<section class="profile">

    <h2>BIODATA MAHASISWA</h2>

    <div class="data">

        <p>Nama Lengkap
            <strong>Raisya Nurul Azkiya</strong>
        </p>

        <p>NIM
            <strong>262302011</strong>
        </p>

        <p>Program Studi
            <strong>Komputerisasi Akuntansi</strong>
        </p>

        <p>Semester
            <strong>1</strong>
        </p>

        <p>Status
            <strong>Mahasiswa Aktif</strong>
        </p>

    </div>

    <div class="line"></div>

    <div class="navigation">

        <h3>Navigasi Materi</h3>

        <div class="nav-buttons">
            <button onclick="openLatihan(41)">Latihan 41</button>
            <button onclick="openLatihan(42)">Latihan 42</button>
            <button onclick="openLatihan(43)">Latihan 43</button>
            <button onclick="openLatihan(44)">Latihan 44</button>
            <button onclick="openPerkalian8()">Perkalian 8</button>
        </div>

    </div>

    <footer>
        © 2026 - Biodata Mahasiswa
    </footer>

</section>


<!-- TAMPILAN TUGAS -->

<section class="task-viewer" id="taskViewer">

    <div class="task-header">
        <h2 id="taskTitle">LATIHAN 41</h2>

        <button class="back-button" onclick="closeLatihan()">
            ← Kembali
        </button>
    </div>

    <iframe
        id="taskFrame"
        class="task-frame"
        title="Materi Latihan">
    </iframe>

</section>


<!-- SCIENTIFIC CALCULATOR -->

<section class="calculator">

    <h1>SCIENTIFIC CALCULATOR</h1>

    <div class="screen">

        <input id="display" value="0" readonly>

        <div id="result">DEG</div>

    </div>

    <div class="top-buttons">

        <button onclick="toggleMode()" id="mode">
            DEG / RAD
        </button>

        <button onclick="copyResult()">
            SALIN HASIL
        </button>

    </div>

    <p class="section-title">FUNGSI ILMIAH</p>

    <div class="keys">

        <button class="special" onclick="add('sin(')">sin</button>
        <button class="special" onclick="add('cos(')">cos</button>
        <button class="special" onclick="add('tan(')">tan</button>
        <button class="special" onclick="add('log(')">log</button>
        <button class="special" onclick="add('ln(')">ln</button>

        <button class="special" onclick="add('sqrt(')">√</button>
        <button class="special" onclick="add('^2')">x²</button>
        <button class="special" onclick="add('^')">xʸ</button>
        <button class="special" onclick="add('(')">(</button>
        <button class="special" onclick="add(')')">)</button>

        <button class="special" onclick="add('π')">π</button>
        <button class="special" onclick="add('e')">e</button>
        <button class="special" onclick="add('%')">%</button>
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="clear" onclick="backspace()">DEL</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button class="operator" onclick="add('/')">÷</button>
        <button class="operator" onclick="add('*')">×</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button class="operator" onclick="add('-')">−</button>
        <button class="operator" onclick="add('+')">+</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button onclick="add('0')">0</button>
        <button onclick="add('.')">.</button>

        <button onclick="add('00')">00</button>

        <button class="equal"
            style="grid-column:span 4"
            onclick="calculate()">
            = HASIL
        </button>

    </div>

    <p class="calculator-note">
        Scientific Calculator © 2026
    </p>

</section>

</div>


<script>

/* NAVIGASI LATIHAN */

function openLatihan(nomor) {

    const viewer = document.getElementById("taskViewer");
    const frame = document.getElementById("taskFrame");
    const title = document.getElementById("taskTitle");

    title.textContent = "LATIHAN " + nomor;

    frame.src = "lat" + nomor + ".html";

    viewer.style.display = "block";

    viewer.scrollIntoView({
        behavior: "smooth"
    });

}

/* NAVIGASI PERKALIAN 8 */

function openPerkalian8() {

    const viewer = document.getElementById("taskViewer");
    const frame = document.getElementById("taskFrame");
    const title = document.getElementById("taskTitle");

    title.textContent = "PERKALIAN 8";

    frame.src = "perkalian8.html";

    viewer.style.display = "block";

    viewer.scrollIntoView({
        behavior: "smooth"
    });

}

function closeLatihan() {

    document.getElementById("taskViewer").style.display = "none";

    document.getElementById("taskFrame").src = "";

}


/* SCIENTIFIC CALCULATOR */

let expression = "";
let angleMode = "DEG";

const display = document.getElementById("display");
const result = document.getElementById("result");

function updateDisplay() {

    display.value = expression || "0";

    result.textContent = angleMode;

}

function add(value) {

    expression += value;

    updateDisplay();

}

function clearDisplay() {

    expression = "";

    updateDisplay();

}

function backspace() {

    expression = expression.slice(0, -1);

    updateDisplay();

}

function toggleMode() {

    angleMode = angleMode === "DEG" ? "RAD" : "DEG";

    updateDisplay();

}


/* PERHITUNGAN */

function calculate() {

    try {

        let exp = expression;

        if (!exp) return;

        exp = exp.replace(/π/g, "Math.PI");
        exp = exp.replace(/\be\b/g, "Math.E");
        exp = exp.replace(/\^/g, "**");

        const sin = x => Math.sin(
            angleMode === "DEG" ? x * Math.PI / 180 : x
        );

        const cos = x => Math.cos(
            angleMode === "DEG" ? x * Math.PI / 180 : x
        );

        const tan = x => Math.tan(
            angleMode === "DEG" ? x * Math.PI / 180 : x
        );

        const sqrt = x => Math.sqrt(x);
        const log = x => Math.log10(x);
        const ln = x => Math.log(x);

        if (!/^[0-9+\-*/().%\sA-Za-z_]+$/.test(exp)) {
            throw new Error("Input tidak valid");
        }

        if (!/^(?=.*\d)[0-9+\-*/().%\sA-Za-z_]+$/.test(exp)) {
            throw new Error("Input tidak valid");
        }

        const answer = Function(
            "sin", "cos", "tan", "sqrt", "log", "ln",
            '"use strict"; return (' + exp + ')'
        )(sin, cos, tan, sqrt, log, ln);

        if (!Number.isFinite(answer)) {
            throw new Error("Hasil tidak terdefinisi");
        }

        expression = String(
            Number(answer.toPrecision(12))
        );

        updateDisplay();

        result.textContent = "Hasil: " + expression;

    } catch (error) {

        result.textContent = "Periksa kembali perhitungan";

    }

}


/* SALIN HASIL */

function copyResult() {

    const text = expression || "0";

    if (navigator.clipboard && window.isSecureContext) {

        navigator.clipboard.writeText(text)
            .then(() => alert("Hasil berhasil disalin!"))
            .catch(() => alert("Tidak dapat menyalin hasil."));

    } else {

        alert("Fitur salin memerlukan koneksi HTTPS.");

    }

}

</script>

</body>
    </html>
