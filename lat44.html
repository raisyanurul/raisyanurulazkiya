
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penentu Huruf Mutu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eaf4ff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #d0dbe8;
        }

        h1 {
            text-align: center;
            color: #2878c8;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #2878c8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        #hasil {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .mutu-A { background: #d1fae5; color: #065f46; }
        .mutu-B { background: #dbeafe; color: #1e40af; }
        .mutu-C { background: #fef3c7; color: #92400e; }
        .mutu-D { background: #ffedd5; color: #9a3412; }
        .mutu-E, .error { background: #fee2e2; color: #991b1b; }
    </style>
</head>

<body>
    <div class="container">
        <h1>Penentu Huruf Mutu</h1>

        <label for="nama">Nama Mahasiswa:</label>
        <input type="text" id="nama" placeholder="Masukkan nama">

        <label for="nilai">Nilai Akhir:</label>
        <input type="text" id="nilai" inputmode="decimal"
               placeholder="Masukkan nilai 0-100">

        <button onclick="hitungNilai()">Hitung Huruf Mutu</button>

        <div id="hasil"></div>
    </div>

    <script>
        function hitungNilai() {
            const nama = document.getElementById("nama").value.trim();
            const teks = document.getElementById("nilai").value.trim();
            const hasil = document.getElementById("hasil");

            hasil.style.display = "block";
            hasil.className = "";

            if (nama === "") {
                return error("Nama harus diisi!");
            }

            if (teks === "") {
                return error("Nilai harus diisi!");
            }

            const nilai = Number(teks.replace(",", "."));

            if (!Number.isFinite(nilai)) {
                return error("Nilai harus berupa angka!");
            }

            if (nilai < 0) {
                return error("Nilai tidak boleh negatif!");
            }

            if (nilai > 100) {
                return error("Nilai tidak boleh melebihi 100!");
            }

            let mutu;

            if (nilai < 49.5) {
                mutu = "E";
            } else if (nilai < 59.5) {
                mutu = "D";
            } else if (nilai < 74.5) {
                mutu = "C";
            } else if (nilai < 84.5) {
                mutu = "B";
            } else {
                mutu = "A";
            }

            hasil.className = "mutu-" + mutu;

            const barisNama = document.createElement("p");
            barisNama.textContent = "Nama: " + nama;

            const barisNilai = document.createElement("p");
            barisNilai.textContent = "Nilai Akhir: " + nilai;

            const barisMutu = document.createElement("h2");
            barisMutu.textContent = "Huruf Mutu: " + mutu;

            hasil.replaceChildren(barisNama, barisNilai, barisMutu);

            function error(pesan) {
                hasil.className = "error";
                hasil.textContent = "Error: " + pesan;
            }
        }
    </script>
</body>
</html>
